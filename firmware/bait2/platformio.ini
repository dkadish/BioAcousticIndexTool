; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:teensymm]
platform = teensy
board = teensymm
board_build.f_cpu =  150000000L ;600000000L
framework = arduino
lib_deps = Wire, CayenneLPP, adafruit/Adafruit TSL2591 Library@^1.4.5
build_flags = -D USB_MIDI_AUDIO_SERIAL -D WAIT_FOR_SERIAL
build_src_filter = +<*> -<main-withserial.cpp>
test_ignore = test_desktop

[env:teensymm-release]
platform = teensy
board = teensymm
board_build.f_cpu =  150000000L ;600000000L
framework = arduino
lib_deps = Wire, CayenneLPP, adafruit/Adafruit TSL2591 Library@^1.4.5
build_flags = -D USB_AUDIO
build_src_filter = +<*> -<main-withserial.cpp>
test_ignore = test_desktop

; Same as teensymm but built from main-withserial.cpp instead of main.cpp:
; adds the serialEvent() AT-passthrough rewrite + re-entrancy fix (relays
; WIO-E5 responses back over USB serial, forwards typed lines to it as AT
; commands, without the reentrancy bug that was corrupting them and
; stalling TTN uplinks). main.cpp itself is left exactly as it was.
[env:teensymm-release-serial]
platform = teensy
board = teensymm
board_build.f_cpu = 150000000L
framework = arduino
lib_deps =
        Wire
        CayenneLPP
        adafruit/Adafruit TSL2591 Library@^1.4.5
build_flags = -D USB_MIDI_AUDIO_SERIAL -D WAIT_FOR_SERIAL
build_src_filter = +<*> -<main.cpp>
test_ignore = test_desktop

; This is for testing purposes
[env:desktop]
platform = native
lib_extra_dirs =
	lib/
	include/
test_ignore = test_embedded
build_flags = -D DESKTOP_NATIVE
build_src_filter = +<*> -<main-withserial.cpp>